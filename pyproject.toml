[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cadros-platform"
version = "0.1.0"
description = "Cadros Spatial Planning & Platform Delivery Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0.0",
    "ezdxf>=1.4.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "poc", "prototype", "rulegraph", "useallow"]
python_files = ["test_*.py"]
addopts = "-v"
