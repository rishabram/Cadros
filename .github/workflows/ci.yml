name: Cadros CI / Platform Verification

on:
  push:
    branches:
      - main
      - 'ag/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Platform & Engine Test Battery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Platform Tests & Health Check Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term tests/test_platform.py

      - name: Run Core Verification Tests
        run: |
          pytest rulegraph/test_caddy_overlay.py rulegraph/test_mu_overlay_v2.py rulegraph/test_quote_fidelity.py rulegraph/test_rulegraph.py prototype/test_attached_product.py prototype/test_culdesac.py prototype/test_dxf_performance.py prototype/test_finance_economics.py prototype/test_lot_split.py

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
